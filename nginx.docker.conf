worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile       on;
    keepalive_timeout 65;

    # ── Upstreams — use Docker service names, not 127.0.0.1 ─────────────────
    upstream django_backend {
        server django:8030;
    }

    upstream pipeline_ws {
        server dockyard:8040;
    }

    upstream chat_ws {
        server dockyard:8041;
    }

    upstream agneis_backend {
        server agneis-django:8060;
    }

    # ── Plain HTTP — ACME challenge only, everything else redirects to HTTPS ──
    server {
        listen 80;
        server_name manojshendre.com www.manojshendre.com agneis.manojshendre.com;

        # Must stay reachable on plain HTTP forever — Certbot renewals
        # validate over :80, never :443.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — the real app ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name manojshendre.com www.manojshendre.com;
        client_max_body_size 500M;

        ssl_certificate     /etc/letsencrypt/live/manojshendre.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/manojshendre.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ── Frontend (built React) ────────────────────────────────────────
        location / {
            root  /app/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── Django API ────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Django admin (login + admin dashboard) ─────────────────────────
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Django static files (admin CSS/JS, served by WhiteNoise) ───────
        location /static/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Chat WebSocket (must be before /ws/) ─────────────────────────
        location /ws/readar-chat/ {
            proxy_pass         http://chat_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # ── Pipeline WebSocket ────────────────────────────────────────────
        location /ws/ {
            proxy_pass         http://pipeline_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }

    # ── AGNEIS — read-only viewer of past negotiation runs ────────────────
    server {
        listen 443 ssl;
        server_name agneis.manojshendre.com;

        ssl_certificate     /etc/letsencrypt/live/agneis.manojshendre.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agneis.manojshendre.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ── Frontend (built React) ────────────────────────────────────────
        location / {
            root  /app/agneis-frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── Django API (read-only: tasks list + task state) ───────────────
        location /api/ {
            proxy_pass http://agneis_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
