worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile       on;
    keepalive_timeout 65;

    # ── Upstreams — use Docker service names, not 127.0.0.1 ─────────────────
    upstream django_backend {
        server django:8030;
    }

    upstream pipeline_ws {
        server dockyard:8040;
    }

    upstream chat_ws {
        server dockyard:8041;
    }

    server {
        listen 8020;
        server_name _;
        client_max_body_size 50M;

        # ── Frontend (built React) ────────────────────────────────────────
        location / {
            root  /app/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── Django API ────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Chat WebSocket (must be before /ws/) ─────────────────────────
        location /ws/chat/ {
            proxy_pass         http://chat_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # ── Pipeline WebSocket ────────────────────────────────────────────
        location /ws/ {
            proxy_pass         http://pipeline_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
