# ── Local dev nginx ─────────────────────────────────────────────────────────
# Same routes as nginx.docker.conf (prod), but plain HTTP on localhost:8080,
# upstreams on 127.0.0.1, and "/" proxied to the Vite dev server so hot
# reload still works. Started by dev.bat — open http://localhost:8080
#
# Prod-only bits deliberately left out: TLS/certs, certbot ACME, the 444
# catch-all, and the AGNEIS subdomain.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile          on;
    keepalive_timeout 65;

    upstream vite_dev       { server 127.0.0.1:5173; }
    upstream django_backend { server 127.0.0.1:8030; }
    upstream pipeline_ws    { server 127.0.0.1:8040; }
    upstream chat_ws        { server 127.0.0.1:8041; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        client_max_body_size 500M;

        # ── Frontend (Vite dev server, incl. its HMR websocket) ──────────
        location / {
            proxy_pass         http://vite_dev;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $http_host;
        }

        # ── Django: API, admin, static ───────────────────────────────────
        location ~ ^/(api|admin|static)/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Chat WebSocket (must be before /ws/) ─────────────────────────
        location /ws/readar-chat/ {
            proxy_pass         http://chat_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $http_host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # ── Pipeline WebSocket ───────────────────────────────────────────
        location /ws/ {
            proxy_pass         http://pipeline_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $http_host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
