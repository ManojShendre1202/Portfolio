services:

  # ── Django (Waitress) ─────────────────────────────────────────────────────
  django:
    build: .
    command: python server.py
    env_file: backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - SIGNAL_HOST=dockyard
      - SIGNAL_PORT=9000
      - PYTHONUNBUFFERED=1
    volumes:
      - media_data:/app/media        # persist uploaded files + processed graphs
    depends_on:
      - dockyard
    restart: unless-stopped

  # ── Dockyard engine (chat WS) ─────────────────────────────────────────────
  dockyard:
    build: .
    command: python -m workflow.main
    env_file: backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - CHAT_WS_PORT=8041
      - PYTHONUNBUFFERED=1
    volumes:
      - media_data:/app/media        # same volume — reads files django wrote
      - hf_cache:/root/.cache/huggingface   # embedder weights — survives rebuilds
    restart: unless-stopped

  # ── AGNEIS (read-only viewer of past negotiation runs, Waitress) ───────────
  agneis-django:
    build: ../AGNEIS
    command: waitress-serve --host=0.0.0.0 --port=8060 backend.wsgi:application
    env_file: ../AGNEIS/agnies_agent/backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - PYTHONUNBUFFERED=1
    volumes:
      - agneis_db:/app/agnies_agent/backend/db
    restart: unless-stopped

  # ── Nginx ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"                  # only nginx is exposed to host
    volumes:
      - ./nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/app/frontend/dist:ro
      - ../AGNEIS/frontend/dist:/app/agneis-frontend/dist:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - django
      - dockyard
      - agneis-django
    restart: unless-stopped

  # ── Certbot (TLS cert issuance/renewal) ────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  media_data:                        # named volume — survives container restarts
  certbot_conf:                      # Let's Encrypt certs + account keys
  certbot_www:                       # ACME HTTP-01 challenge webroot, shared with certbot
  hf_cache:                          # HuggingFace model cache — avoids re-downloading on every rebuild
  agneis_db:                         # AGNEIS sqlite db — persists across container rebuilds
