<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Readar Admin</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171b; --border: #23272e; --text: #e7e9ec;
    --muted: #8b93a1; --accent: #5ee6a8; --warn: #f5a623; --err: #f55b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden;
  }

  /* ── Sidebar ── */
  nav {
    width: 200px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 1rem 0;
  }
  nav .brand { font-weight: 700; font-size: 1rem; padding: 0 1.25rem 1rem; letter-spacing: 0.02em; }
  nav .brand span { color: var(--accent); }
  nav .section-label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 1rem 1.25rem 0.4rem; }
  nav button {
    all: unset; cursor: pointer; padding: 0.55rem 1.25rem; font-size: 0.88rem; color: var(--muted);
    border-left: 3px solid transparent;
  }
  nav button:hover { color: var(--text); background: #1a1e24; }
  nav button.active { color: var(--text); border-left-color: var(--accent); background: #1a1e24; }
  nav .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 0.5rem; }

  /* ── Main ── */
  main { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
  h1 { font-size: 1.1rem; margin: 0 0 1.25rem; color: var(--muted); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
  .card h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 0.5rem; font-weight: 600; }
  .card .value { font-size: 1.7rem; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 0.78rem; margin-top: 0.25rem; }
  .bar { background: #22262d; border-radius: 4px; height: 5px; margin-top: 0.6rem; overflow: hidden; }
  .bar > div { background: var(--accent); height: 100%; transition: width 0.3s; }
  .bar.warn > div { background: var(--warn); }
  .bar.err > div { background: var(--err); }

  /* ── Log viewer ── */
  .log-toolbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
  .log-toolbar select, .log-toolbar button {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 0.4rem 0.7rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
  }
  .log-status { color: var(--muted); font-size: 0.78rem; margin-left: auto; }
  #logbox {
    background: #08090b; border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem; height: calc(100vh - 160px); overflow-y: auto;
    font-family: 'Cascadia Code', Consolas, monospace; font-size: 0.78rem; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }
  #logbox .line { padding: 1px 0; }
  #logbox .lvl-ERROR, #logbox .lvl-CRITICAL { color: var(--err); }
  #logbox .lvl-WARNING { color: var(--warn); }
  #logbox .lvl-INFO { color: var(--text); }
  #logbox .lvl-DEBUG { color: var(--muted); }
  #logbox .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<nav>
  <div class="brand">Readar <span>Admin</span></div>

  <div class="section-label">Overview</div>
  <button data-view="overview" class="active"><span class="dot"></span>Live Status</button>

  <div class="section-label">Logs</div>
  <button data-view="log" data-source="django">Django</button>
  <button data-view="log" data-source="dockyard">Dockyard</button>
  <button data-view="log" data-source="rag">RAG Pipeline</button>
  <button data-view="log" data-source="core">Core / API</button>
</nav>

<main>
  <div id="overview-view">
    <h1>Live Server Status</h1>
    <div class="grid" id="grid"></div>
  </div>

  <div id="log-view" style="display:none;">
    <h1 id="log-title">Logs</h1>
    <div class="log-toolbar">
      <label style="color:var(--muted); font-size:0.8rem;">Lines:</label>
      <select id="lineCount">
        <option value="100">100</option>
        <option value="200" selected>200</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
      <button id="pauseBtn">Pause</button>
      <span class="log-status" id="logStatus"></span>
    </div>
    <div id="logbox"><div class="empty">Loading…</div></div>
  </div>
</main>

<script>
const state = { view: 'overview', source: 'django', paused: false };

function bar(pct) {
  const cls = pct > 90 ? 'err' : pct > 70 ? 'warn' : '';
  return `<div class="bar ${cls}"><div style="width:${Math.min(pct,100)}%"></div></div>`;
}

function card(title, value, sub, pct) {
  return `<div class="card"><h2>${title}</h2><div class="value">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}${pct != null ? bar(pct) : ''}</div>`;
}

async function refreshOverview() {
  const r = await fetch('stats/');
  const d = await r.json();
  let html = '';
  html += card('CPU (whole machine)', d.server.cpu_percent + '%', null, d.server.cpu_percent);
  html += card('Memory', d.server.mem_percent + '%', `${d.server.mem_used_gb} / ${d.server.mem_total_gb} GB`, d.server.mem_percent);
  html += card('Disk', d.server.disk_percent + '%', `${d.server.disk_used_gb} / ${d.server.disk_total_gb} GB`, d.server.disk_percent);
  html += card('Live WS Connections', d.live.ws_connections, d.live.stats_age_sec != null ? `updated ${d.live.stats_age_sec}s ago` : 'no data yet — start a chat');
  html += card('Active Users (5 min)', d.db.recent_users, 'distinct visitors, DB-derived');
  if (d.live.gemini) {
    const g = d.live.gemini;
    html += card('Gemini RPM', `${g.rpm}/${g.rpm_limit}`, null, 100 * g.rpm / g.rpm_limit);
    html += card('Gemini RPD', `${g.rpd}/${g.rpd_limit}`, `${g.tokens_today.toLocaleString()} tokens today`, 100 * g.rpd / g.rpd_limit);
  }
  html += card('Total Sessions', d.db.total_sessions, `${d.db.active_sessions} active`);
  html += card('Total Chat Turns', d.db.total_turns);
  document.getElementById('grid').innerHTML = html;
}

function lineClass(line) {
  for (const lvl of ['CRITICAL','ERROR','WARNING','INFO','DEBUG']) {
    if (line.includes(' ' + lvl + ' ')) return 'lvl-' + lvl;
  }
  return '';
}

async function refreshLog() {
  if (state.paused) return;
  const n = document.getElementById('lineCount').value;
  const r = await fetch(`logs/?source=${state.source}&lines=${n}`);
  const d = await r.json();
  const box = document.getElementById('logbox');
  const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;

  if (!d.exists) {
    box.innerHTML = '<div class="empty">No log file yet for this source — nothing has logged here.</div>';
  } else if (d.lines.length === 0) {
    box.innerHTML = '<div class="empty">Log file is empty.</div>';
  } else {
    box.innerHTML = d.lines.map(l => `<div class="line ${lineClass(l)}">${escapeHtml(l)}</div>`).join('');
  }
  document.getElementById('logStatus').textContent = `${d.lines ? d.lines.length : 0} lines · refreshed ${new Date().toLocaleTimeString()}`;
  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setView(view, source) {
  state.view = view;
  if (source) state.source = source;
  document.getElementById('overview-view').style.display = view === 'overview' ? '' : 'none';
  document.getElementById('log-view').style.display = view === 'log' ? '' : 'none';
  if (view === 'log') {
    document.getElementById('log-title').textContent = source.charAt(0).toUpperCase() + source.slice(1) + ' Logs';
    refreshLog();
  } else {
    refreshOverview();
  }
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setView(btn.dataset.view, btn.dataset.source);
  });
});

document.getElementById('lineCount').addEventListener('change', refreshLog);
document.getElementById('pauseBtn').addEventListener('click', (e) => {
  state.paused = !state.paused;
  e.target.textContent = state.paused ? 'Resume' : 'Pause';
});

setInterval(() => { state.view === 'overview' ? refreshOverview() : refreshLog(); }, 4000);
refreshOverview();
</script>
</body>
</html>
